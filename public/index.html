<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14122b">
<title>Rareté – le jeu des réponses uniques</title>
<style>
  :root{
    --bg:#14122b; --card:#201d42; --card2:#2b2759; --text:#f4f2ff; --muted:#a9a4d6;
    --accent:#ffcf4a; --violet:#7c5cff; --good:#3ddc97; --warn:#ff9f43; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100dvh; color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1100px 560px at 50% -12%, #2f2878 0%, var(--bg) 62%) fixed;
    display:flex; justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
  }
  .app{width:100%; max-width:560px}
  .screen[hidden]{display:none}
  h1{font-size:2.8rem; margin:.5em 0 .1em; letter-spacing:-.03em; text-align:center}
  h1 span{color:var(--accent)}
  .tag{color:var(--muted); text-align:center; margin:0 0 1.6rem}
  .card{background:var(--card); border-radius:20px; padding:18px; margin-bottom:14px}
  label{display:block; font-size:.85rem; color:var(--muted); margin:0 0 6px}
  input[type=text]{
    width:100%; padding:14px 16px; border-radius:14px; border:2px solid transparent;
    background:var(--card2); color:var(--text); font-size:1.1rem; outline:none;
  }
  input[type=text]:focus{border-color:var(--violet)}
  input.code{text-transform:uppercase; letter-spacing:.35em; text-align:center; font-weight:800; font-size:1.5rem}
  button{
    font:inherit; font-weight:700; border:0; border-radius:14px; padding:14px 18px; cursor:pointer;
    color:#1a1530; background:var(--accent); width:100%; font-size:1.05rem;
    transition:transform .08s ease, filter .15s;
  }
  button:active{transform:scale(.98)}
  button:disabled{opacity:.45; cursor:not-allowed}
  button.sec{background:var(--card2); color:var(--text)}
  button.ghost{background:transparent; color:var(--muted); font-weight:600}
  .row{display:flex; gap:10px}
  .row > *{flex:1}
  .sep{display:flex; align-items:center; gap:12px; color:var(--muted); margin:18px 0; font-size:.85rem}
  .sep::before,.sep::after{content:""; flex:1; height:1px; background:#3a3570}
  .stack > * + *{margin-top:12px}

  /* salon */
  .code-big{font-size:3.4rem; font-weight:900; letter-spacing:.2em; text-align:center; color:var(--accent); margin:.1em 0; padding-left:.2em}
  .hint{color:var(--muted); text-align:center; font-size:.9rem; margin:0}
  .players{display:flex; flex-wrap:wrap; gap:8px}
  .chip{background:var(--card2); border-radius:999px; padding:8px 14px; font-weight:600; font-size:.95rem}
  .chip.me{outline:2px solid var(--violet)}
  .chip.off{opacity:.45}
  .seg{display:flex; background:var(--card2); border-radius:14px; padding:4px; gap:4px}
  .seg button{background:transparent; color:var(--muted); padding:10px 4px; border-radius:11px; font-size:.95rem}
  .seg button.on{background:var(--violet); color:#fff}
  .seg button:disabled{opacity:1; cursor:default}
  .seg.locked button:not(.on){opacity:.4}

  /* question */
  .top{display:flex; justify-content:space-between; color:var(--muted); font-size:.9rem; margin:6px 2px 10px}
  .bar{height:10px; background:var(--card2); border-radius:999px; overflow:hidden}
  .bar > i{display:block; height:100%; width:100%; background:var(--good); border-radius:999px; transition:width .25s linear, background .3s}
  .bar > i.mid{background:var(--warn)} .bar > i.low{background:var(--bad)}
  .timer{font-variant-numeric:tabular-nums; font-weight:800; color:var(--text)}
  .cat{display:inline-block; font-size:.75rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:26px 0 6px}
  .q{font-size:1.9rem; line-height:1.2; font-weight:800; margin:0 0 22px}
  .status{min-height:1.4em; text-align:center; color:var(--muted); margin:12px 0 0; font-size:.95rem}
  .status.ok{color:var(--good); font-weight:700}

  /* révélation */
  .res{display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center;
       background:var(--card); border-radius:16px; padding:12px 14px; margin-bottom:8px; border-left:5px solid #4a4585;
       animation:in .45s both}
  .res.unique{border-color:var(--good)} .res.partagee{border-color:var(--warn)}
  .res.inconnue{border-color:var(--bad)}
  .res .who{font-weight:800}
  .res .ans{color:var(--muted); font-size:.92rem; grid-column:1}
  .res .pts{grid-row:1 / span 2; grid-column:2; font-size:1.7rem; font-weight:900; text-align:right; font-variant-numeric:tabular-nums}
  .res.unique .pts{color:var(--good)} .res.partagee .pts{color:var(--warn)}
  .res .pts small{display:block; font-size:.7rem; font-weight:700; color:var(--muted); letter-spacing:.04em}
  .badge{font-size:.72rem; font-weight:800; padding:2px 8px; border-radius:999px; background:#3a3570; margin-left:6px; vertical-align:middle}
  .badge.good{background:rgba(61,220,151,.18); color:var(--good)}
  .badge.warn{background:rgba(255,159,67,.18); color:var(--warn)}
  .badge.bad{background:rgba(255,107,107,.18); color:var(--bad)}
  @keyframes in{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
  .also{color:var(--muted); font-size:.9rem; margin:6px 2px 14px}
  .also b{color:var(--text)}
  .score-line{display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px solid #332f66}
  .score-line:last-child{border:0}
  .score-line.me b{color:var(--accent)}

  /* podium */
  .podium{display:flex; align-items:flex-end; justify-content:center; gap:10px; margin:26px 0 18px; min-height:230px}
  .pod{flex:1; max-width:150px; text-align:center}
  .pod .name{font-weight:800; margin-bottom:2px; word-break:break-word}
  .pod .sc{color:var(--muted); font-size:.9rem; margin-bottom:6px}
  .pod .blk{border-radius:14px 14px 0 0; display:flex; align-items:flex-start; justify-content:center; font-size:2rem; padding-top:8px;
            animation:rise .8s .2s both cubic-bezier(.2,.8,.2,1)}
  .pod.p1 .blk{height:150px; background:linear-gradient(#ffd75e,#e7a912)}
  .pod.p2 .blk{height:112px; background:linear-gradient(#d9deea,#9aa3b8)}
  .pod.p3 .blk{height:84px; background:linear-gradient(#e0a070,#a8672f)}
  @keyframes rise{from{transform:scaleY(.05); transform-origin:bottom}to{transform:scaleY(1); transform-origin:bottom}}

  .toast{position:fixed; left:50%; bottom:max(24px,env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(30px);
         background:#000c; color:#fff; padding:12px 18px; border-radius:14px; opacity:0; transition:.25s; pointer-events:none; max-width:90vw; text-align:center; z-index:9}
  .toast.show{opacity:1; transform:translateX(-50%)}
  .conn{position:fixed; top:0; left:0; right:0; background:var(--bad); color:#fff; text-align:center; font-size:.85rem; padding:4px; z-index:9}
  .conn[hidden]{display:none}
  @media (min-width:600px){ .q{font-size:2.2rem} }
</style>
</head>
<body>
<div class="conn" id="conn" hidden>Connexion perdue… reconnexion</div>
<main class="app">

  <!-- ACCUEIL -->
  <section class="screen" id="s-home">
    <h1>Rare<span>té</span></h1>
    <p class="tag">Plus ta réponse est rare, plus elle rapporte.</p>
    <div class="card stack">
      <div>
        <label for="pseudo">Ton pseudo</label>
        <input type="text" id="pseudo" maxlength="14" autocomplete="nickname" placeholder="Ex : Camille">
      </div>
      <button id="btn-create">Créer un salon</button>
      <div class="sep">ou rejoindre</div>
      <div>
        <label for="code">Code du salon</label>
        <input type="text" class="code" id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD">
      </div>
      <button class="sec" id="btn-join">Rejoindre</button>
    </div>
  </section>

  <!-- SALON -->
  <section class="screen" id="s-lobby" hidden>
    <p class="hint" style="margin-top:22px">Code du salon</p>
    <div class="code-big" id="l-code">----</div>
    <p class="hint" id="l-hint-join">Les autres joueurs entrent ce code sur cette même page.</p>
    <p class="hint" id="l-hint-solo" hidden style="color:var(--accent);font-weight:700">🎮 Mode solo — tu joues seul !</p>
    <div class="row" style="margin:14px 0">
      <button class="sec" id="btn-share">Partager le lien</button>
    </div>
    <div class="card">
      <label>Joueurs (<span id="l-count">0</span>/12)</label>
      <div class="players" id="l-players"></div>
    </div>
    <div class="card stack">
      <div>
        <label>Nombre de manches</label>
        <div class="seg" id="seg-manches">
          <button data-v="5">5 manches</button><button data-v="10">10 manches</button>
        </div>
      </div>
      <div>
        <label>Temps par question</label>
        <div class="seg" id="seg-temps">
          <button data-v="20">20 s</button><button data-v="30">30 s</button><button data-v="45">45 s</button><button data-v="60">60 s</button>
        </div>
      </div>
    </div>
    <button id="btn-start">Lancer la partie</button>
    <p class="hint" id="l-wait" style="margin-top:12px" hidden>En attente du chef de salon…</p>
    <button class="ghost" id="btn-leave1" style="margin-top:8px">Quitter le salon</button>
  </section>

  <!-- QUESTION -->
  <section class="screen" id="s-question" hidden>
    <div class="top"><span id="q-round">Manche 1/5</span><span class="timer" id="q-time">30</span></div>
    <div class="bar"><i id="q-bar"></i></div>
    <span class="cat" id="q-cat"></span>
    <h2 class="q" id="q-text"></h2>
    <form id="q-form" class="stack" autocomplete="off">
      <input type="text" id="q-input" maxlength="60" placeholder="Ta réponse…" enterkeyhint="send" autocapitalize="sentences">
      <button type="submit" id="q-send">Valider</button>
    </form>
    <p class="status" id="q-status"></p>
  </section>

  <!-- RÉSULTATS DE MANCHE -->
  <section class="screen" id="s-reveal" hidden>
    <div class="top"><span id="r-round">Manche 1/5</span><span class="timer" id="r-time"></span></div>
    <h2 class="q" style="font-size:1.3rem; margin:8px 0 14px" id="r-q"></h2>
    <div id="r-rows"></div>
    <p class="also" id="r-also"></p>
    <div class="card"><label>Classement</label><div id="r-board"></div></div>
    <button id="btn-skip">Question suivante</button>
  </section>

  <!-- FIN -->
  <section class="screen" id="s-final" hidden>
    <h1 style="font-size:2.2rem">Podium</h1>
    <div class="podium" id="f-podium"></div>
    <div class="card"><label>Classement final</label><div id="f-board"></div></div>
    <div class="stack">
      <button id="btn-again">Rejouer avec le même salon</button>
      <button class="ghost" id="btn-leave2">Quitter</button>
    </div>
  </section>

</main>
<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const socket = io();
  const $ = (id) => document.getElementById(id);
  const SESSION = 'rarete_session', PSEUDO = 'rarete_pseudo';
  let S = null, offset = 0, roundKey = '', revealKey = '';

  const store = {
    get: (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del: (k) => { try { localStorage.removeItem(k); } catch {} },
  };
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const show = (name) => document.querySelectorAll('.screen').forEach((s) => { s.hidden = s.id !== 's-' + name; });

  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  /* ----- accueil ----- */
  $('pseudo').value = store.get(PSEUDO) || '';
  const urlCode = new URLSearchParams(location.search).get('code');
  if (urlCode) $('code').value = urlCode.toUpperCase().slice(0, 4);
  $('code').addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, ''); });

  function enter(res) {
    if (!res.ok) return toast(res.error || 'Impossible de continuer.');
    store.set(SESSION, { code: res.code, pid: res.pid });
  }
  const pseudoValue = () => { const p = $('pseudo').value.trim(); store.set(PSEUDO, p); return p; };

  $('btn-create').onclick = () => socket.emit('create_room', { pseudo: pseudoValue() }, enter);
  $('btn-join').onclick = () => {
    const code = $('code').value.trim();
    if (code.length !== 4) return toast('Le code fait 4 lettres.');
    socket.emit('join_room', { code, pseudo: pseudoValue() }, enter);
  };
  $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btn-join').click(); });

  function leave() {
    socket.emit('leave_room');
    store.del(SESSION); S = null; roundKey = ''; revealKey = '';
    history.replaceState(null, '', location.pathname);
    show('home');
  }
  $('btn-leave1').onclick = leave;
  $('btn-leave2').onclick = leave;

  /* ----- connexion / reconnexion ----- */
  socket.on('connect', () => {
    $('conn').hidden = true;
    const ses = store.get(SESSION);
    if (ses) socket.emit('reconnect_room', ses, (r) => { if (!r.ok) { store.del(SESSION); S = null; show('home'); } });
  });
  socket.on('disconnect', () => { $('conn').hidden = false; });

  socket.on('state', (st) => {
    S = st;
    offset = st.serverNow - Date.now();
    render();
  });

  /* ----- salon ----- */
  const isHost = () => S && S.hostId === S.you;

  function renderLobby() {
    $('l-code').textContent = S.code;
    $('l-count').textContent = S.players.length;
    const solo = S.players.length === 1;
    $('l-hint-join').hidden = solo;
    $('l-hint-solo').hidden = !solo;
    const box = $('l-players'); box.replaceChildren();
    for (const p of S.players) {
      const c = mk('span', 'chip' + (p.id === S.you ? ' me' : '') + (p.connected ? '' : ' off'),
        (p.id === S.hostId ? '👑 ' : '') + p.pseudo);
      box.appendChild(c);
    }
    for (const [id, key] of [['seg-manches', 'manches'], ['seg-temps', 'temps']]) {
      const seg = $(id);
      seg.classList.toggle('locked', !isHost());
      seg.querySelectorAll('button').forEach((b) => {
        b.classList.toggle('on', Number(b.dataset.v) === S.settings[key]);
        b.disabled = !isHost();
      });
    }
    $('btn-start').hidden = !isHost();
    $('l-wait').hidden = isHost();
  }
  for (const [id, key] of [['seg-manches', 'manches'], ['seg-temps', 'temps']]) {
    $(id).addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b || !isHost()) return;
      socket.emit('update_settings', { [key]: Number(b.dataset.v) });
    });
  }
  $('btn-start').onclick = () => socket.emit('start_game', {}, (r) => { if (!r.ok) toast(r.error || 'Impossible de lancer.'); });
  $('btn-share').onclick = async () => {
    const url = `${location.origin}${location.pathname}?code=${S.code}`;
    try {
      if (navigator.share) await navigator.share({ title: 'Rareté', text: `Rejoins ma partie ! Code : ${S.code}`, url });
      else { await navigator.clipboard.writeText(url); toast('Lien copié !'); }
    } catch { /* annulé */ }
  };

  /* ----- question ----- */
  function renderQuestion() {
    const key = S.code + ':' + S.round;
    if (key !== roundKey) {
      roundKey = key;
      $('q-input').value = S.myAnswer || '';
      setTimeout(() => $('q-input').focus(), 50);
    }
    $('q-round').textContent = `Manche ${S.round}/${S.totalRounds}`;
    $('q-cat').textContent = S.question.categorie;
    $('q-text').textContent = S.question.texte;
    const done = S.players.filter((p) => p.answered).length;
    const st = $('q-status');
    if (S.myAnswer) {
      st.className = 'status ok';
      st.textContent = `✓ Réponse envoyée (${done}/${S.players.length}) — tu peux la modifier`;
    } else {
      st.className = 'status';
      st.textContent = `${done}/${S.players.length} ont répondu`;
    }
    $('q-send').textContent = S.myAnswer ? 'Modifier' : 'Valider';
    tick();
  }
  $('q-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $('q-input').value.trim();
    if (!text) return;
    socket.emit('submit_answer', { text }, (r) => { if (!r.ok) toast('Trop tard !'); });
  });

  /* ----- résultats ----- */
  const STATUS = {
    unique: () => ['Unique !', 'good'],
    partagee: (n) => [`Partagée ×${n}`, 'warn'],
    annulee: (n) => [`Annulée ×${n}`, ''],
    inconnue: () => ['Non reconnue', 'bad'],
    none: () => ['Pas de réponse', ''],
  };

  function boardInto(el, list) {
    el.replaceChildren();
    [...list].sort((a, b) => b.score - a.score).forEach((p, i) => {
      const line = mk('div', 'score-line' + (p.id === S.you ? ' me' : ''));
      line.append(mk('span', '', `${i + 1}. ${p.pseudo}`), mk('b', '', `${p.score} pts`));
      el.appendChild(line);
    });
  }

  function renderReveal() {
    $('r-round').textContent = `Manche ${S.round}/${S.totalRounds}`;
    $('r-q').textContent = S.question.texte;
    const key = S.code + ':' + S.round;
    if (key !== revealKey) {
      revealKey = key;
      const box = $('r-rows'); box.replaceChildren();
      S.reveal.rows.forEach((r, i) => {
        const [label, tone] = STATUS[r.status](r.groupSize);
        const row = mk('div', 'res ' + r.status);
        row.style.animationDelay = (i * 0.12) + 's';
        const who = mk('div', 'who', r.pseudo + (r.id === S.you ? ' (toi)' : ''));
        who.appendChild(mk('span', 'badge ' + tone, label));
        let ans = r.text ? `« ${r.text} »` : '—';
        if (r.canonical && r.canonical.toLowerCase() !== r.text.toLowerCase()) ans += `  →  ${r.canonical}`;
        const pts = mk('div', 'pts', r.pts > 0 ? '+' + r.pts : '0');
        if (r.rarete) pts.appendChild(mk('small', '', `rareté ${r.rarete}`));
        row.append(who, pts, mk('div', 'ans', ans));
        box.appendChild(row);
      });
      const also = $('r-also');
      also.replaceChildren();
      if (S.reveal.autres.length) {
        also.append('Personne n’a trouvé : ');
        S.reveal.autres.forEach((a, i) => {
          if (i) also.append(', ');
          const b = mk('b', '', a.nom); also.append(b, ` (${a.pts} pts)`);
        });
      }
    }
    boardInto($('r-board'), S.players);
    $('btn-skip').hidden = !isHost();
    $('btn-skip').textContent = S.lastRound ? 'Voir le podium' : 'Question suivante';
    tick();
  }
  $('btn-skip').onclick = () => socket.emit('skip_reveal');

  /* ----- fin ----- */
  function renderFinal() {
    const pod = $('f-podium'); pod.replaceChildren();
    const top = S.ranking.slice(0, 3);
    const order = [top[1], top[0], top[2]]; // 2e, 1er, 3e
    const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
    order.forEach((p) => {
      if (!p) return;
      const d = mk('div', 'pod p' + Math.min(p.rank, 3));
      d.append(mk('div', 'name', p.pseudo + (p.id === S.you ? ' (toi)' : '')), mk('div', 'sc', p.score + ' pts'),
               mk('div', 'blk', medals[Math.min(p.rank, 3)]));
      pod.appendChild(d);
    });
    const b = $('f-board'); b.replaceChildren();
    S.ranking.forEach((p) => {
      const line = mk('div', 'score-line' + (p.id === S.you ? ' me' : ''));
      line.append(mk('span', '', `${p.rank}. ${p.pseudo}`), mk('b', '', `${p.score} pts`));
      b.appendChild(line);
    });
    $('btn-again').hidden = !isHost();
  }
  $('btn-again').onclick = () => socket.emit('play_again');

  /* ----- aiguillage + chrono ----- */
  function render() {
    if (!S) return show('home');
    if (S.phase !== 'question') roundKey = '';
    if (S.phase !== 'reveal') revealKey = '';
    show(S.phase);
    ({ lobby: renderLobby, question: renderQuestion, reveal: renderReveal, final: renderFinal })[S.phase]();
  }

  function tick() {
    if (!S) return;
    const now = Date.now() + offset;
    if (S.phase === 'question') {
      const total = S.settings.temps * 1000;
      const left = Math.max(0, S.endsAt - now);
      $('q-time').textContent = Math.ceil(left / 1000) + ' s';
      const pct = Math.min(100, (left / total) * 100);
      const bar = $('q-bar'); bar.style.width = pct + '%';
      bar.className = pct < 20 ? 'low' : pct < 50 ? 'mid' : '';
    } else if (S.phase === 'reveal') {
      const left = Math.max(0, S.revealEndsAt - now);
      $('r-time').textContent = 'Suite dans ' + Math.ceil(left / 1000) + ' s';
    }
  }
  setInterval(tick, 250);
})();
</script>
</body>
</html>
